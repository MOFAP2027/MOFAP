  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + Number(dias));

};

  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return `${parseInt(d)} ${meses[parseInt(m)-1]}`;
};

// Devuelve el lunes (ISO) de la semana que contiene la fecha dada
function lunesDe(iso) {
  const d = new Date(iso + "T00:00:00");
  const dow = (d.getDay() + 6) % 7; // 0=lunes
  d.setDate(d.getDate() - dow);
  return d.toISOString().slice(0, 10);
}
// Número de semana ISO (para el título "SEMANA 33")
function numeroSemana(iso) {
  const d = new Date(iso + "T00:00:00");
  const jueves = new Date(d);
  jueves.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const primerJueves = new Date(jueves.getFullYear(), 0, 4);
  const dif = (jueves - primerJueves) / 86400000;
  return 1 + Math.round((dif - 3 + ((primerJueves.getDay() + 6) % 7)) / 7);
}
const DIAS_SEMANA = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];

// Ordena lotes por fecha de poda (más temprana primero).
// Los que no tienen poda van al final, ordenados por nombre de lote.
function ordenarPorPoda(a, b) {
  if (a.poda && b.poda) {
    if (a.poda !== b.poda) return a.poda < b.poda ? -1 : 1;
    return a.lote.localeCompare(b.lote, "es", { numeric: true });
  }
  if (a.poda) return -1;
  if (b.poda) return 1;
  return a.lote.localeCompare(b.lote, "es", { numeric: true });
}

// ============ MOTOR DE FÓRMULAS ============
function computarFechas(l) {
  const f = {};
  if (l.poda) f["1.PODA"] = l.poda;
  if (l.cianamida) f["CIANAMIDA"] = l.cianamida;
  for (let pase = 0; pase < 6; pase++) {
    let cambio = false;
    LABORES.forEach(lab => {
      if (f[lab] || MANUALES.includes(lab)) return;
      if (lab === "19. Cosecha") {
        if (l.cianamida && l.fenologia) { f[lab] = addDias(l.cianamida, l.fenologia); cambio = true; }
        return;
      }
      const fo = l.formulas?.[lab];
      if (!fo) return;
      const fechaBase = fo.base === "CIANAMIDA" ? l.cianamida
        : fo.base === "1.PODA" ? l.poda
        : f[fo.base];
      if (fechaBase) { f[lab] = addDias(fechaBase, fo.dias); cambio = true; }
    });
    if (!cambio) break;
  }
  (l.excluidas || []).forEach(lab => { delete f[lab]; });
  return f;
}

function construirLote(base) {
  const fechas = base.fechas || {};
  const poda = fechas["1.PODA"] || null;
  const cianamida = fechas["CIANAMIDA"] || null;
  let fenologia = base.fenologia || 190;
  if (cianamida && fechas["19. Cosecha"]) fenologia = diffDias(fechas["19. Cosecha"], cianamida);
  // Todos los lotes usan las mismas fórmulas estándar
  return { lote: base.lote, fundo: base.fundo, area: base.area, variedad: base.variedad,
    fenologia, poda, cianamida, formulas: { ...formulasDefecto() }, excluidas: [] };
}

function estadoLabor(fechaProg, fechaReal) {
  if (fechaReal) return "completada";
  if (!fechaProg) return "sin-fecha";
  const dias = diffDias(fechaProg, hoy());
  if (dias < 0) return "vencida";
  if (dias <= 14) return "proxima";
  return "pendiente";
}

function sello() {
  return USUARIO_ACTUAL
    ? { modificado_por: USUARIO_ACTUAL.nombre, modificado_en: new Date().toISOString() }
    : {};
}
async function registrarBitacora(accion, detalle) {
  if (!USUARIO_ACTUAL) return;
  try {
    await sb.from("corrida_bitacora").insert({
      usuario: USUARIO_ACTUAL.nombre, fundo: USUARIO_ACTUAL.fundo, accion, detalle
    });
  } catch (e) { /* la bitácora no debe bloquear el guardado */ }
}

const db = {
  async cargarTodo() {
    const [l, r, p, pr, m, b] = await Promise.all([
      sb.from("corrida_lotes").select("*"),
      sb.from("corrida_reales").select("*"),
      sb.from("corrida_pautas").select("*").order("created_at", { ascending: false }),
      sb.from("corrida_parametros").select("*"),
      sb.from("corrida_materiales").select("*").order("created_at"),
      sb.from("corrida_bitacora").select("*").order("creado_en", { ascending: false }).limit(60)
    ]);
    for (const res of [l, r, p, pr, m]) if (res.error) throw res.error;
    return { lotes: l.data, reales: r.data, pautas: p.data, parametros: pr.data, materiales: m.data, bitacora: b.data || [] };
  },
  async sembrarSiVacio(datos) {
    if (datos.lotes.length > 0) return false;
    const filas = EXCEL.map(construirLote).map(x => ({
      lote: x.lote, fundo: x.fundo, area: x.area, variedad: x.variedad,
      fenologia: x.fenologia, poda: x.poda, cianamida: x.cianamida,
      formulas: x.formulas, excluidas: x.excluidas
    }));
    const r1 = await sb.from("corrida_lotes").insert(filas);
    if (r1.error) throw r1.error;
    await sb.from("corrida_parametros").upsert(PARAMETROS_INICIALES, { onConflict: "tipo,labor" });
    await sb.from("corrida_materiales").insert(MATERIALES_INICIALES);
    return true;
  },
  async guardarLote(l) {
    const r = await sb.from("corrida_lotes").upsert({
      lote: l.lote, fundo: l.fundo, area: l.area, variedad: l.variedad,
      fenologia: l.fenologia, poda: l.poda, cianamida: l.cianamida,
      formulas: l.formulas, excluidas: l.excluidas || [], updated_at: new Date().toISOString(), ...sello()
    });
    if (!r.error) registrarBitacora("Editó lote", `Lote ${l.lote} (${l.fundo})`);
    return r;
  },
  async guardarReal(lote, labor, fecha) {
    let r;
    if (fecha) r = await sb.from("corrida_reales").upsert({ lote, labor, fecha, ...sello() }, { onConflict: "lote,labor" });
    else r = await sb.from("corrida_reales").delete().match({ lote, labor });
    if (!r.error) registrarBitacora(fecha ? "Registró fecha real" : "Borró fecha real", `${lote} · ${labor}${fecha ? " → " + fecha : ""}`);
    return r;
  },
  async guardarPauta(p) {
    const r = await sb.from("corrida_pautas").upsert({
      id: p.id, labor: p.labor, lote: p.lote || "",
      pauta: p.pauta || "", pauta_val: p.pautaVal || {}, precio: p.precio || {}, ev: p.ev || {}, ...sello()
    });
    if (!r.error) registrarBitacora("Editó pauta", `${p.labor}${p.lote ? " " + p.lote : ""}`);
    return r;
  },
  async eliminarPauta(id) {
    const r = await sb.from("corrida_pautas").delete().eq("id", id);
    if (!r.error) registrarBitacora("Eliminó pauta", "");
    return r;
  },
  async guardarParametros(tipo, labor, lista) {
    const r = await sb.from("corrida_parametros").upsert({ tipo, labor, lista }, { onConflict: "tipo,labor" });
    if (!r.error) registrarBitacora("Editó parámetros", `${tipo} · ${labor}`);
    return r;
  },
  async guardarMaterial(m) {
    const r = await sb.from("corrida_materiales").upsert({
      id: m.id, nombre: m.nombre || "", tipo: m.tipo || "Insumo", unidad: m.unidad || "",
      duracion_dias: m.duracionDias || "", cantidad_ha: m.cantidadHa || "", labores: m.labores || [], ...sello()
    });
    if (!r.error) registrarBitacora("Editó material", m.nombre || "");
    return r;
  },
  async eliminarMaterial(id) {
    const r = await sb.from("corrida_materiales").delete().eq("id", id);
    if (!r.error) registrarBitacora("Eliminó material", "");
    return r;
  },
  async cargarSemana(semanaLunes) {
    const r = await sb.from("corrida_semanal").select("*").eq("semana_lunes", semanaLunes);
    if (r.error) throw r.error;
    return r.data || [];
  },
  async guardarCeldaSemanal(celda) {
    const r = await sb.from("corrida_semanal").upsert({
      id: celda.id, semana_lunes: celda.semana_lunes, fundo: celda.fundo,
      labor: celda.labor, dia: celda.dia, lotes: celda.lotes || "", np: celda.np || "", ...sello()
    });
    if (!r.error) registrarBitacora("Editó programa semanal", `${celda.labor} · ${DIAS_SEMANA[celda.dia]}`);
    return r;
  }
};

  const [lotes, setLotes] = useState(null);

  const [parametrosEv, setParametrosEv] = useState({});
  const [parametrosPauta, setParametrosPauta] = useState({});
  const [materiales, setMateriales] = useState([]);
  const [vista, setVista] = useState("panel");
  const [filtroFundo, setFiltroFundo] = useState("todos");
  const [filtroVariedad, setFiltroVariedad] = useState("todas");
  const [filtroLaborPauta, setFiltroLaborPauta] = useState("todas");
  const [loteAbierto, setLoteAbierto] = useState(null);
  const [guardando, setGuardando] = useState(false);
  const [error, setError] = useState(null);
  const [sesion, setSesion] = useState(leerSesion());
  const [bitacora, setBitacora] = useState([]);
  const [mostrarAcceso, setMostrarAcceso] = useState(false);
  const [semanaLunes, setSemanaLunes] = useState(lunesDe(hoy()));
  const [celdasSemana, setCeldasSemana] = useState({});

  // Aplicar la identidad al módulo de base de datos
  useEffect(() => {
    USUARIO_ACTUAL = sesion ? { nombre: sesion.nombre, fundo: sesion.fundo } : null;
  }, [sesion]);
  const puedeEditar = !!sesion;

  const recargar = async () => {
    try {
      setError(null);
      let datos = await db.cargarTodo();
      const sembrado = await db.sembrarSiVacio(datos);
      if (sembrado) datos = await db.cargarTodo();
      setLotes(datos.lotes.map(f => ({
        lote: f.lote, fundo: f.fundo, area: Number(f.area), variedad: f.variedad,
        fenologia: f.fenologia, poda: f.poda, cianamida: f.cianamida,
        // Se combinan las fórmulas por defecto con las guardadas: así una labor
        // nueva (que aún no está en la base de datos) aparece con su fórmula,
        // sin pisar los ajustes que el usuario ya haya hecho por lote.
        formulas: { ...formulasDefecto(), ...(f.formulas || {}) }, excluidas: f.excluidas || []
      })));
      const r = {};
      datos.reales.forEach(x => { r[`${x.lote}|${x.labor}`] = x.fecha; });
      setReales(r);
      setPautas(datos.pautas.map(f => ({
        id: f.id, labor: f.labor, lote: f.lote || "", pauta: f.pauta || "",
        pautaVal: f.pauta_val || {}, precio: { ...PRECIO_VACIO, ...(f.precio || {}) }, ev: f.ev || {}
      })));
      const pe = {}, pp = {};
      datos.parametros.forEach(x => { (x.tipo === "ev" ? pe : pp)[x.labor] = x.lista || []; });
      setParametrosEv(pe);
      setParametrosPauta(pp);
      setMateriales(datos.materiales.map(f => ({
        id: f.id, nombre: f.nombre, tipo: f.tipo, unidad: f.unidad,
        duracionDias: f.duracion_dias || "", cantidadHa: f.cantidad_ha || "", labores: f.labores || []
      })));
      setBitacora(datos.bitacora || []);
    } catch (e) {
      console.error(e);
      setError(SUPABASE_ANON_KEY.includes("PEGA_AQUI")
        ? "Falta configurar la anon key de Supabase en index.html"
        : "No se pudo conectar a la base de datos. Revisa tu conexión y recarga.");
      if (!lotes) setLotes([]);
    }
  };

  useEffect(() => { recargar(); }, []);

  // Cargar el programa semanal cada vez que cambia la semana seleccionada
  const cargarSemana = async () => {
    try {
      const filas = await db.cargarSemana(semanaLunes);
      const m = {};
      filas.forEach(f => { m[`${f.fundo}|${f.labor}|${f.dia}`] = { lotes: f.lotes || "", np: f.np || "" }; });
      setCeldasSemana(m);
    } catch (e) { console.error(e); }
  };
  useEffect(() => { if (lotes) cargarSemana(); }, [semanaLunes, lotes]);

  const guardarCeldaSemanal = (fundo, labor, dia, campo, valor) => {
    const key = `${fundo}|${labor}|${dia}`;
    const actual = celdasSemana[key] || { lotes: "", np: "" };
    const nueva = { ...actual, [campo]: valor };
    setCeldasSemana(prev => ({ ...prev, [key]: nueva }));

            <table style={S.tabla}>
              <thead>
                <tr>
                  <th style={{ ...S.th, ...S.thFijo }}>Lote</th>
                  <th style={S.th}>DDC</th>
                  {LABORES.map(lab => (
                    <th key={lab} style={S.th} title={lab}>{nombreCortoLabor(lab)}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {lotesFiltrados.map(l => {
                  const fechas = fechasPorLote[l.lote] || {};
                  const ddc = l.cianamida ? diffDias(hoy(), l.cianamida) : null;
                  return (
                    <tr key={l.lote}>
                      <td style={{ ...S.td, ...S.tdFijo }} onClick={() => setLoteAbierto(l.lote)}>
                        <b>{l.lote}</b>
                        <div style={S.tdSub}>{l.fundo} · {l.variedad} · {l.area} ha</div>
                      </td>
                      <td style={{ ...S.td, fontWeight: 700, color: "#6b3fa0" }} onClick={() => setLoteAbierto(l.lote)}>
                        {ddc !== null ? ddc : "—"}
                      </td>
                      {LABORES.map(lab => {
                        if ((l.excluidas || []).includes(lab)) return (
                          <td key={lab} style={{ ...S.td, color: "#c8c6ba", background: "#f4f3ec", fontStyle: "italic" }}
                            onClick={() => setLoteAbierto(l.lote)} title={`${lab} no aplica en ${l.lote}`}>
                            n/a
                          </td>
                        );
                        const prog = fechas[lab];
                        const real = reales[`${l.lote}|${lab}`];
                        const est = estadoLabor(prog, real);
                        return (
                          <td key={lab} style={{ ...S.td, ...S.celda[est] }}
                            onClick={() => setLoteAbierto(l.lote)} title={`${l.lote} — ${lab}`}>
                            {fmtCorta(prog)}
                          </td>
                        );
                      })}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* ============ LOTES ============ */}
      {vista === "lotes" && (
        <div>
          <Filtros filtroFundo={filtroFundo} setFiltroFundo={setFiltroFundo}
            filtroVariedad={filtroVariedad} setFiltroVariedad={setFiltroVariedad} lotes={lotes} />
          <div style={S.gridLotes}>
            {lotesFiltrados.map(l => {
              const fechas = fechasPorLote[l.lote] || {};
              const nLabs = Object.keys(fechas).length;
              const nComp = LABORES.filter(lab => fechas[lab] && reales[`${l.lote}|${lab}`]).length;
              const vencidas = LABORES.filter(lab =>
                estadoLabor(fechas[lab], reales[`${l.lote}|${lab}`]) === "vencida").length;
              return (
                <button key={l.lote} style={S.cardLote} onClick={() => setLoteAbierto(l.lote)}>
                  <div style={S.cardLoteTop}>
                    <span style={S.loteNombre}>{l.lote}</span>
                    <span style={S.badgeVar}>{l.variedad}</span>
                  </div>
                  <div style={S.cardLoteInfo}>{l.fundo} · {l.area} ha · fen. {l.fenologia} d</div>
                  {nLabs === 0
                    ? <div style={S.cardLoteAlerta}>Falta poda y cianamida — toca para ingresar</div>
                    : <div style={S.cardLoteProg}>
                        <div style={{ ...S.barra, width: `${(nComp / nLabs) * 100}%` }} />
                        <span style={S.barraTxt}>{nComp}/{nLabs} labores{vencidas > 0 ? ` · ${vencidas} vencidas` : ""}</span>
                      </div>}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* ============ PAUTAS ============ */}
      {vista === "pautas" && (
        <SeccionPautas pautas={pautas} lotes={lotes}
          onCrear={crearPauta} onActualizar={actualizarPauta} onEliminar={eliminarPauta}
          parametrosEv={parametrosEv} onGuardarParametrosEv={guardarParametrosEv}
          parametrosPauta={parametrosPauta} onGuardarParametrosPauta={guardarParametrosPauta}
          filtroLabor={filtroLaborPauta} setFiltroLabor={setFiltroLaborPauta} />
      )}

      {/* ============ MATERIALES ============ */}
      {vista === "materiales" && (
        <SeccionMateriales materiales={materiales}
          onCrear={crearMaterial} onActualizar={actualizarMaterial} onEliminar={eliminarMaterial} />
      )}

      {vista === "bitacora" && (
        <SeccionBitacora bitacora={bitacora} onRecargar={recargar} />
      )}

      {vista === "semanal" && (
        <SeccionSemanal
          lotes={lotes} fechasPorLote={fechasPorLote}
          semanaLunes={semanaLunes} setSemanaLunes={setSemanaLunes}
          celdas={celdasSemana} onGuardarCelda={guardarCeldaSemanal} />
      )}

      {mostrarAcceso && (
        <ModalAcceso
          onCerrar={() => setMostrarAcceso(false)}
          onEntrar={(clave) => {
            const u = USUARIOS[clave.trim().toLowerCase()];
            if (!u) return false;
            const s = { nombre: u.nombre, fundo: u.fundo };
            guardarSesion(s); setSesion(s); setMostrarAcceso(false);
            return true;
          }} />
      )}

      {loteDetalle && (
        <DetalleLote lote={loteDetalle} fechas={fechasPorLote[loteDetalle.lote] || {}}
          reales={reales}
          onCerrar={() => setLoteAbierto(null)}
          onActualizar={actualizarLote}
          onFechaReal={setFechaReal} />
      )}
    </div>
  );
}

// ============ SECCIÓN PAUTAS ============
function SeccionPautas({ pautas, lotes, onCrear, onActualizar, onEliminar,
  parametrosEv, onGuardarParametrosEv, parametrosPauta, onGuardarParametrosPauta,
  filtroLabor, setFiltroLabor }) {
  const [filtroFundo, setFiltroFundo] = useState("todos");
  const [filtroLote, setFiltroLote] = useState("todos");
  const [mostrarNueva, setMostrarNueva] = useState(false);
  const [nuevaLabor, setNuevaLabor] = useState(LABORES[0]);
  const [nuevoLote, setNuevoLote] = useState("");
  const [mostrarParams, setMostrarParams] = useState(false);
  const [tipoParams, setTipoParams] = useState("pauta");
  const [laborParams, setLaborParams] = useState(LABORES[0]);
  const [nuevoParam, setNuevoParam] = useState("");
  const [expandida, setExpandida] = useState(null);

  const fundoDe = useMemo(() => {
    const m = {};
    (lotes || []).forEach(l => { m[l.lote] = l.fundo; });
    return m;
  }, [lotes]);

  const crear = () => {
    const id = onCrear(nuevaLabor, nuevoLote);
    setMostrarNueva(false);
    setNuevoLote("");
    setExpandida(id);
  };

  const setParamsLabor = tipoParams === "pauta" ? onGuardarParametrosPauta : onGuardarParametrosEv;
  const paramsActuales = tipoParams === "pauta" ? parametrosPauta : parametrosEv;
  const paramsPautaDe = (labor) => parametrosPauta[labor] || [];
  const paramsEvDe = (labor) => parametrosEv[labor] || [];
  const agregarParam = () => {
    const t = nuevoParam.trim();
    const lista = paramsActuales[laborParams] || [];
    if (!t || lista.includes(t)) return;
    setParamsLabor(laborParams, [...lista, t]);
    setNuevoParam("");
  };
  const quitarParam = (param) => {
    const lista = paramsActuales[laborParams] || [];
    setParamsLabor(laborParams, lista.filter(x => x !== param));
  };
  const moverParam = (param, dir) => {
    const lista = [...(paramsActuales[laborParams] || [])];
    const i = lista.indexOf(param);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= lista.length) return;
    [lista[i], lista[j]] = [lista[j], lista[i]];
    setParamsLabor(laborParams, lista);
  };

  const visibles = pautas.filter(p =>
    (filtroLabor === "todas" || p.labor === filtroLabor) &&
    (filtroFundo === "todos" || !p.lote || fundoDe[p.lote] === filtroFundo) &&
    (filtroLote === "todos" || (filtroLote === "general" ? !p.lote : p.lote === filtroLote))
  );
  const lotesFiltro = (lotes || []).filter(l => filtroFundo === "todos" || l.fundo === filtroFundo).sort(ordenarPorPoda);
  const TURNOS = [["manana", "Mañana"], ["tarde", "Tarde"], ["noche", "Noche"]];

  return (
    <div>
      <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 12, flexWrap: "wrap" }}>
        <button style={S.btnPrimario} onClick={() => setMostrarNueva(v => !v)}>+ Nueva pauta</button>
        <button style={S.btnSecundario} onClick={() => setMostrarParams(v => !v)}>⚙ Parámetros</button>
        <select style={S.select} value={filtroFundo}
          onChange={e => { setFiltroFundo(e.target.value); setFiltroLote("todos"); }}>
          <option value="todos">Ambos fundos</option>
          <option value="LG">Fundo LG</option>
          <option value="AP">Fundo AP</option>
        </select>
        <select style={S.select} value={filtroLote} onChange={e => setFiltroLote(e.target.value)}>
          <option value="todos">Todos los lotes</option>
          <option value="general">Sin lote (generales)</option>
          {lotesFiltro.map(l => <option key={l.lote} value={l.lote}>{l.lote} · {l.fundo}</option>)}
        </select>
        <select style={S.select} value={filtroLabor} onChange={e => setFiltroLabor(e.target.value)}>
          <option value="todas">Todas las labores</option>
          {LABORES.map(l => <option key={l} value={l}>{l}</option>)}
        </select>
      </div>

      {filtroLote !== "todos" && filtroLote !== "general" && (
        <p style={{ fontSize: 12.5, color: "#6b7565", margin: "0 0 10px" }}>
          Mostrando las {visibles.length} pauta{visibles.length !== 1 ? "s" : ""} de labores registradas en el lote <b>{filtroLote}</b>.
        </p>
      )}

      {mostrarNueva && (
        <div style={S.formNueva}>
          <div style={S.manualTitulo}>Nueva pauta — elige labor y lote (no se podrán cambiar después)</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            <select style={S.select} value={nuevaLabor} onChange={e => setNuevaLabor(e.target.value)}>
              {LABORES.map(l => <option key={l} value={l}>{l}</option>)}
            </select>
            <select style={S.select} value={nuevoLote} onChange={e => setNuevoLote(e.target.value)}>
              <option value="">Sin lote (general)</option>
              {[...(lotes || [])].sort(ordenarPorPoda).map(l => <option key={l.lote} value={l.lote}>{l.lote} · {l.fundo}</option>)}
            </select>
            <button style={S.btnPrimario} onClick={crear}>Crear pauta</button>
            <button style={S.btnSecundario} onClick={() => setMostrarNueva(false)}>Cancelar</button>
          </div>
        </div>
      )}

      {mostrarParams && (
        <div style={S.formNueva}>
          <div style={S.manualTitulo}>Parámetros por labor</div>
          <p style={{ fontSize: 12.5, color: "#4a3568", margin: "0 0 8px", lineHeight: 1.5 }}>
            Los parámetros de <b>pauta</b> son lo que se indica al personal;
            los de <b>ev. de calidad</b> son lo que se mide en campo. Aparecen automáticamente en todas
            las pautas de esa labor, en el orden en que estén aquí — usa las flechas ◀ ▶ para ordenarlos.
          </p>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 8 }}>
            <div style={S.switchModo}>
              <button style={{ ...S.switchBtn, ...(tipoParams === "pauta" ? S.switchActivo : {}) }}
                onClick={() => setTipoParams("pauta")}>Pauta</button>
              <button style={{ ...S.switchBtn, ...(tipoParams === "ev" ? S.switchActivoReal : {}) }}
                onClick={() => setTipoParams("ev")}>Ev. de calidad</button>
            </div>
            <select style={S.select} value={laborParams} onChange={e => setLaborParams(e.target.value)}>
              {LABORES.map(l => <option key={l} value={l}>{l}</option>)}
            </select>
            <input type="text" style={{ ...S.inputFecha, minWidth: 190 }} value={nuevoParam}
              placeholder={tipoParams === "pauta" ? "Ej: N° de cargadores a dejar" : "Ej: PROM CARGADORES"}
              onChange={e => setNuevoParam(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter") agregarParam(); }} />
            <button style={S.btnPrimario} onClick={agregarParam}>Agregar</button>
          </div>
          <div style={S.chipsLabores}>
            {(paramsActuales[laborParams] || []).length === 0
              ? <span style={{ fontSize: 12.5, color: "#8a8f85", fontStyle: "italic" }}>Sin parámetros de {tipoParams === "pauta" ? "pauta" : "evaluación"} para esta labor todavía.</span>
              : (paramsActuales[laborParams] || []).map((param, i, arr) => (
                  <span key={param} style={S.chipLabor}>
                    <button style={{ ...S.chipMover, opacity: i === 0 ? 0.25 : 1 }}
                      onClick={() => moverParam(param, -1)} disabled={i === 0} title="Mover antes">◀</button>
                    {param}
                    <button style={{ ...S.chipMover, opacity: i === arr.length - 1 ? 0.25 : 1 }}
                      onClick={() => moverParam(param, 1)} disabled={i === arr.length - 1} title="Mover después">▶</button>
                    <button style={S.chipQuitar} onClick={() => quitarParam(param)} title="Quitar parámetro">✕</button>
                  </span>
                ))}
          </div>
        </div>
      )}

      {visibles.length === 0 && (
        <p style={S.vacio}>No hay pautas registradas con estos filtros. Crea una con el botón "+ Nueva pauta".</p>
      )}

      <div style={S.listaPautas}>
        {visibles.map(p => {
          const paramsPauta = paramsPautaDe(p.labor);
          const paramsEv = paramsEvDe(p.labor);
          const extrasPauta = Object.keys(p.pautaVal || {}).filter(k => !paramsPauta.includes(k) && p.pautaVal[k]);
          const extrasEv = Object.keys(p.ev || {}).filter(k => !paramsEv.includes(k) && p.ev[k]);
          const precio = { ...PRECIO_VACIO, ...(p.precio || {}) };
          const abierta = expandida === p.id;
          const resumenParams = paramsPauta.filter(k => (p.pautaVal || {})[k])
            .map(k => `${k.replace(/^N° de\s*/i, "")}: ${p.pautaVal[k]}`).slice(0, 2).join(" · ");
          const precioResumen = [precio.manana && `M: ${precio.manana}`, precio.tarde && `T: ${precio.tarde}`, precio.noche && `N: ${precio.noche}`]
            .filter(Boolean).join(" · ");
          const nEvLlenos = [...paramsEv, ...extrasEv].filter(k => (p.ev || {})[k]).length;
          return (
            <div key={p.id} style={{ ...S.filaPauta, ...(abierta ? S.filaPautaAbierta : {}) }}>
              <button style={S.filaPautaHead} onClick={() => setExpandida(abierta ? null : p.id)}>
                <span style={S.filaPautaFlecha}>{abierta ? "▾" : "▸"}</span>
                <span style={S.filaPautaTitulo}>
                  {nombreCortoLabor(p.labor).toUpperCase()}
                  {p.lote ? <b> {p.lote}</b> : <span style={{ color: "#8a8f85", fontWeight: 400 }}> general</span>}
                  {p.lote && fundoDe[p.lote] ? <span style={{ color: "#8a8f85", fontWeight: 400 }}> · {fundoDe[p.lote]}</span> : ""}
                </span>
                <span style={S.filaPautaResumen}>
                  {resumenParams || (p.pauta ? p.pauta.split("\n")[0].slice(0, 40) : "sin pauta")}
                </span>
                <span style={S.filaPautaExtra}>
                  {precioResumen && <span style={S.miniTagPrecio}>{precioResumen}</span>}
                  {nEvLlenos > 0 && <span style={S.miniTagEv}>ev ✓</span>}
                </span>
              </button>

              {abierta && (
                <div style={S.detallePauta}>
                  <div style={S.detalleCol}>
                    <label style={S.pautaCampoLabel}>Pauta</label>
                    {[...paramsPauta, ...extrasPauta].map(param => (
                      <div key={param} style={S.evFila}>
                        <span style={S.evNombre}>{param}</span>
                        <input type="text" style={S.pautaValInput} placeholder="valor"
                          defaultValue={(p.pautaVal || {})[param] || ""} key={`pv-${p.id}-${param}`}
                          onBlur={e => onActualizar(p.id, { pautaVal: { ...(p.pautaVal || {}), [param]: e.target.value } })} />
                      </div>
                    ))}
                    <textarea style={S.textareaPauta} rows={4} placeholder={"Indicaciones de corrido:\n• Instrucción 1\n• Instrucción 2"}
                      defaultValue={p.pauta} key={`pa-${p.id}`}
                      onBlur={e => onActualizar(p.id, { pauta: e.target.value })} />
                  </div>

                  <div style={S.detalleCol}>
                    <label style={S.pautaCampoLabel}>Precio o tarea por turno</label>
                    {TURNOS.map(([k, nombre]) => (
                      <div key={k} style={S.evFila}>
                        <span style={S.evNombre}>{nombre}</span>
                        <input type="text" style={S.inputPrecioTurno} placeholder="precio o tarea"
                          defaultValue={precio[k]} key={`pr-${p.id}-${k}`}
                          onBlur={e => onActualizar(p.id, { precio: { ...precio, [k]: e.target.value } })} />
                      </div>
                    ))}

                    <label style={{ ...S.pautaCampoLabel, color: "#8a6508", marginTop: 8 }}>Ev. de calidad</label>
                    {paramsEv.length === 0 && extrasEv.length === 0 && (
                      <div style={S.evVacia}>Sin parámetros. Agrégalos en "⚙ Parámetros".</div>
                    )}
                    {[...paramsEv, ...extrasEv].map(param => (
                      <div key={param} style={S.evFila}>
                        <span style={S.evNombre}>{param}</span>
                        <input type="text" style={S.evInput} placeholder="resultado real"
                          defaultValue={(p.ev || {})[param] || ""} key={`ev-${p.id}-${param}`}
                          onBlur={e => onActualizar(p.id, { ev: { ...(p.ev || {}), [param]: e.target.value } })} />
                      </div>
                    ))}

                    <div style={{ marginTop: 10, textAlign: "right" }}>
                      <button style={S.btnEliminarTexto}
                        onClick={() => { if (confirm("¿Eliminar esta pauta?")) onEliminar(p.id); }}>
                        Eliminar pauta
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============ SECCIÓN MATERIALES ============
function SeccionMateriales({ materiales, onCrear, onActualizar, onEliminar }) {
  const [filtroLabor, setFiltroLabor] = useState("todas");

  const agregarLabor = (m, lab) => {
    if (!lab || (m.labores || []).includes(lab)) return;
    onActualizar(m.id, { labores: [...(m.labores || []), lab] });
  };
  const quitarLabor = (m, lab) => {
    onActualizar(m.id, { labores: (m.labores || []).filter(x => x !== lab) });
  };

  const visibles = filtroLabor === "todas"
    ? materiales
    : materiales.filter(m => (m.labores || []).includes(filtroLabor));
  const epps = visibles.filter(m => m.tipo === "EPP");
  const insumos = visibles.filter(m => m.tipo !== "EPP");

  const Fila = ({ m }) => (
    <tr>
      <td style={S.tdMat}>
        <input type="text" style={S.inputMat} placeholder="Nombre" defaultValue={m.nombre} key={`n-${m.id}`}
          onBlur={e => onActualizar(m.id, { nombre: e.target.value })} />
      </td>
      <td style={S.tdMat}>
        <select style={S.inputMat} value={m.tipo} onChange={e => onActualizar(m.id, { tipo: e.target.value })}>
          <option value="EPP">EPP</option>
          <option value="Insumo">Insumo</option>
        </select>
      </td>
      <td style={S.tdMat}>
        <input type="text" style={S.inputMat} placeholder="unidad, kg, par…" defaultValue={m.unidad} key={`u-${m.id}`}
          onBlur={e => onActualizar(m.id, { unidad: e.target.value })} />
      </td>
      <td style={S.tdMat}>
        {m.tipo === "EPP"
          ? <input type="number" style={S.inputMat} placeholder="días" defaultValue={m.duracionDias} key={`d-${m.id}`}
              onBlur={e => onActualizar(m.id, { duracionDias: e.target.value })} />
          : <span style={S.matNoAplica}>—</span>}
      </td>
      <td style={S.tdMat}>
        {m.tipo !== "EPP"
          ? <input type="number" step="0.01" style={S.inputMat} placeholder="cant./ha" defaultValue={m.cantidadHa} key={`c-${m.id}`}
              onBlur={e => onActualizar(m.id, { cantidadHa: e.target.value })} />
          : <span style={S.matNoAplica}>—</span>}
      </td>
      <td style={{ ...S.tdMat, minWidth: 200 }}>
        <div style={S.chipsLabores}>
          {(m.labores || []).map(lab => (
            <span key={lab} style={S.chipLabor}>
              {nombreCortoLabor(lab)}
              <button style={S.chipQuitar} onClick={() => quitarLabor(m, lab)} title="Quitar labor">✕</button>
            </span>
          ))}
          <select style={S.selectAgregarLabor} value=""
            onChange={e => agregarLabor(m, e.target.value)}>
            <option value="">+ labor</option>
            {LABORES.filter(l => !(m.labores || []).includes(l))
              .map(l => <option key={l} value={l}>{l}</option>)}
          </select>
        </div>
      </td>
      <td style={{ ...S.tdMat, textAlign: "center" }}>
        <button style={S.btnEliminar}
          onClick={() => { if (confirm("¿Eliminar este material?")) onEliminar(m.id); }} title="Eliminar">✕</button>
      </td>
    </tr>
  );

  const Tabla = ({ titulo, items, nota }) => (
    <section style={{ marginBottom: 28 }}>
      <h2 style={S.subtitulo}>{titulo}</h2>
      {nota && <p style={S.notaMat}>{nota}</p>}
      <div style={S.tablaWrap}>
        <table style={{ ...S.tabla, width: "100%", minWidth: 760 }}>
          <thead>
            <tr>
              <th style={{ ...S.th, textAlign: "left", paddingLeft: 12 }}>Material</th>
              <th style={S.th}>Tipo</th>
              <th style={S.th}>Unidad de medida</th>
              <th style={S.th}>Duración (días)</th>
              <th style={S.th}>Cantidad / ha</th>
              <th style={S.th}>Labores donde se usa</th>
              <th style={S.th}></th>
            </tr>
          </thead>
          <tbody>
            {items.map(m => <Fila key={m.id} m={m} />)}
            {items.length === 0 && (
              <tr><td colSpan={7} style={{ ...S.tdMat, textAlign: "center", color: "#8a8f85", padding: 16 }}>
                Sin registros{filtroLabor !== "todas" ? " para esta labor" : ""}
              </td></tr>
            )}

      </div>

  );

  return (
    <div>

          <option value="todas">Todas las labores</option>
          {LABORES.map(l => <option key={l} value={l}>{l}</option>)}
        </select>
        {filtroLabor !== "todas" && (
          <span style={{ fontSize: 12.5, color: "#6b7565" }}>
            Mostrando materiales usados en {nombreCortoLabor(filtroLabor)}
          </span>

      <Tabla titulo="EPPs" items={epps}
        nota="Equipos de protección personal. La duración indica cada cuántos días se cambia. Asigna en qué labores se usa cada uno." />

        nota="Amarra, junco, ligapal, etc. La cantidad por hectárea sirve para calcular necesidades por lote. Un mismo material puede usarse en varias labores." />
    </div>
  );
}

// ============ SECCIÓN SEMANAL ============
function SeccionSemanal({ lotes, fechasPorLote, semanaLunes, setSemanaLunes, celdas, onGuardarCelda }) {
  // Fechas ISO de los 7 días de la semana (lunes..domingo)
  const dias = useMemo(() => {
    return Array.from({ length: 7 }, (_, i) => addDias(semanaLunes, i));
  }, [semanaLunes]);

  // Autollenado: para cada fundo+labor+día, qué lotes tienen esa labor programada ese día.
  // Devuelve { "FUNDO|LABOR|DIA": "A13/A6" }
  const autoLotes = useMemo(() => {
    const map = {};
    (lotes || []).forEach(l => {
      const fechas = fechasPorLote[l.lote] || {};
      LABORES.forEach(lab => {
        const f = fechas[lab];
        if (!f) return;
        const idx = dias.indexOf(f);
        if (idx < 0) return;
        const key = `${l.fundo}|${lab}|${idx}`;
        map[key] = map[key] ? `${map[key]}/${l.lote}` : l.lote;
      });
    });
    return map;
  }, [lotes, fechasPorLote, dias]);

  // Qué labores mostrar por fundo: las que tienen al menos un lote programado esta semana
  const filasPorFundo = useMemo(() => {
    const res = { AP: [], LG: [] };
    ["AP", "LG"].forEach(fundo => {
      LABORES.forEach(lab => {
        let hay = false;
        for (let d = 0; d < 7; d++) {
          if (autoLotes[`${fundo}|${lab}|${d}`]) { hay = true; break; }
          if ((celdas[`${fundo}|${lab}|${d}`] || {}).np) { hay = true; break; }
        }
        if (hay) res[fundo].push(lab);
      });
    });
    return res;
  }, [autoLotes, celdas]);

  const valorCelda = (fundo, lab, d, campo) => {
    const guardada = celdas[`${fundo}|${lab}|${d}`];
    if (guardada && guardada[campo] !== undefined && guardada[campo] !== "") return guardada[campo];
    if (campo === "lotes") return autoLotes[`${fundo}|${lab}|${d}`] || "";
    return "";
  };

  // Total de personas por día (suma de N.P de ambos fundos)
  const totalDia = (d) => {
    let t = 0;
    ["AP", "LG"].forEach(fundo => {
      filasPorFundo[fundo].forEach(lab => {
        const np = parseFloat(valorCelda(fundo, lab, d, "np"));
        if (!isNaN(np)) t += np;
      });
    });
    return t;
  };
  const totalFundoDia = (fundo, d) => {
    let t = 0;
    filasPorFundo[fundo].forEach(lab => {
      const np = parseFloat(valorCelda(fundo, lab, d, "np"));
      if (!isNaN(np)) t += np;
    });
    return t;
  };

  const fmtDiaEncabezado = (iso) => {
    const [y, m, d] = iso.split("-");
    const meses = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
    return `${parseInt(d)}-${meses[parseInt(m)-1]}`;
  };

  const hayDatos = filasPorFundo.AP.length > 0 || filasPorFundo.LG.length > 0;

  const FilasFundo = ({ fundo, color }) => filasPorFundo[fundo].map(lab => (
    <tr key={`${fundo}-${lab}`}>
      <td style={{ ...S.semFundoCell, color }}>{fundo === "AP" ? "A P" : "L G"}</td>
      <td style={{ ...S.semLaborCell, color }}>{nombreCortoLabor(lab).toUpperCase()}</td>
      {dias.map((iso, d) => (
        <td key={d} style={{ ...S.semCelda, ...(d >= 6 ? S.semDomingo : {}) }}>
          <input type="text" style={S.semInputLote}
            value={valorCelda(fundo, lab, d, "lotes")}
            placeholder="—"
            onChange={e => onGuardarCelda(fundo, lab, d, "lotes", e.target.value)} />
          <input type="text" inputMode="numeric" style={S.semInputNp}
            value={valorCelda(fundo, lab, d, "np")}
            placeholder="N.P"
            onChange={e => onGuardarCelda(fundo, lab, d, "np", e.target.value)} />
        </td>
      ))}
    </tr>
  ));

  return (
    <div>
      <div style={S.semHead}>
        <button style={S.semNav} onClick={() => setSemanaLunes(addDias(semanaLunes, -7))}>◀ Anterior</button>
        <div style={S.semTitulo}>
          SEMANA {numeroSemana(semanaLunes)}
          <div style={S.semRango}>{fmtDiaEncabezado(semanaLunes)} al {fmtDiaEncabezado(addDias(semanaLunes, 6))}</div>
        </div>
        <button style={S.semNav} onClick={() => setSemanaLunes(addDias(semanaLunes, 7))}>Siguiente ▶</button>
        <button style={{ ...S.btnRecargar, marginLeft: 8 }} onClick={() => setSemanaLunes(lunesDe(hoy()))}>Hoy</button>
      </div>

      <p style={S.notaMat}>
        Los lotes se llenan solos según las fechas del cronograma programado. Puedes editar cualquier
        casilla de lote o escribir el N.P (número de personas); todo se guarda en la base de datos.
      </p>

      {!hayDatos
        ? <p style={S.vacio}>No hay labores programadas para esta semana. Usa las flechas para ver otra semana,
            o revisa que los lotes tengan sus fechas de cianamida cargadas.</p>
        : <div style={S.tablaWrap}>
            <table style={S.semTabla}>
              <thead>
                <tr>
                  <th style={{ ...S.semTh, width: 34 }}>FD</th>
                  <th style={{ ...S.semTh, textAlign: "left", paddingLeft: 8, minWidth: 130 }}>LABOR</th>
                  {dias.map((iso, d) => (
                    <th key={d} style={{ ...S.semTh, ...(d >= 6 ? S.semDomingoTh : {}) }}>
                      {DIAS_SEMANA[d]}
                      <div style={S.semThFecha}>{fmtDiaEncabezado(iso)}</div>
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filasPorFundo.AP.length > 0 && <FilasFundo fundo="AP" color="#1f5ecc" />}
                {filasPorFundo.LG.length > 0 && <FilasFundo fundo="LG" color="#2e7d4f" />}
                {/* TOTALES */}
                <tr>
                  <td colSpan={2} style={S.semTotalLabel}>TOTAL</td>
                  {dias.map((iso, d) => (
                    <td key={d} style={{ ...S.semTotalCell, ...(d >= 6 ? S.semDomingo : {}) }}>
                      {totalDia(d) > 0 ? totalDia(d) : ""}
                    </td>
                  ))}
                </tr>
                {filasPorFundo.LG.length > 0 && (
                  <tr>
                    <td colSpan={2} style={{ ...S.semTotalLabel, background: "#bfe3c8", color: "#1c4a2c" }}>L G · DIURNO</td>
                    {dias.map((iso, d) => (
                      <td key={d} style={{ ...S.semSubtotal, background: "#dcf0e2", ...(d >= 6 ? S.semDomingo : {}) }}>
                        {totalFundoDia("LG", d) > 0 ? totalFundoDia("LG", d) : ""}
                      </td>
                    ))}
                  </tr>
                )}
                {filasPorFundo.AP.length > 0 && (
                  <tr>
                    <td colSpan={2} style={{ ...S.semTotalLabel, background: "#bcd6f5", color: "#1c3a66" }}>A P · DIURNO</td>
                    {dias.map((iso, d) => (
                      <td key={d} style={{ ...S.semSubtotal, background: "#dbe8fb", ...(d >= 6 ? S.semDomingo : {}) }}>
                        {totalFundoDia("AP", d) > 0 ? totalFundoDia("AP", d) : ""}
                      </td>
                    ))}
                  </tr>
                )}
              </tbody>
            </table>
          </div>}
    </div>
  );
}

// ============ DETALLE DE LOTE ============
function DetalleLote({ lote, fechas, reales, onCerrar, onActualizar, onFechaReal }) {
  const [borradores, setBorradores] = useState({});
  const cia = lote.cianamida;
  const ddc = cia ? diffDias(hoy(), cia) : null;

  const aplicarFormula = (lab, texto) => {
    const n = parseInt(String(texto).replace(/\s/g, ""), 10);
    if (!isNaN(n)) {
      onActualizar(lote.lote, {
        formulas: { ...lote.formulas, [lab]: { ...lote.formulas[lab], dias: n } }
      });
    }
    setBorradores(b => { const c = { ...b }; delete c[lab]; return c; });
  };

  const cambiarFechaProg = (lab, nueva) => {
    if (!nueva) return;
    if (lab === "19. Cosecha") {
      if (cia) onActualizar(lote.lote, { fenologia: diffDias(nueva, cia) });
      return;
    }
    const fo = lote.formulas[lab];
    if (!fo) return;
    const fechaBase = fo.base === "CIANAMIDA" ? cia : fo.base === "1.PODA" ? lote.poda : fechas[fo.base];
    if (fechaBase) {
      onActualizar(lote.lote, {
        formulas: { ...lote.formulas, [lab]: { ...fo, dias: diffDias(nueva, fechaBase) } }
      });
    }
  };

  const textoFormula = (lab) => {
    if (lab === "19. Cosecha") return "CIA + FEN";
    const fo = lote.formulas[lab];
    if (!fo) return "";
    return ABREV[fo.base] || fo.base;
  };

  const excluidas = lote.excluidas || [];
  const toggleExcluida = (lab) => {
    const nuevas = excluidas.includes(lab)
      ? excluidas.filter(x => x !== lab)
      : [...excluidas, lab];
    onActualizar(lote.lote, { excluidas: nuevas });
  };

  return (
    <div style={S.modalFondo} onClick={onCerrar}>
      <div style={S.modal} onClick={e => e.stopPropagation()}>
        <div style={S.modalHead}>
          <div>
            <h2 style={S.modalTitulo}>Lote {lote.lote}</h2>
            <div style={S.modalSub}>
              Fundo {lote.fundo} · {lote.variedad} · {lote.area} ha
              {ddc !== null && <> · <b>DDC {ddc}</b></>}
            </div>
          </div>
          <button style={S.btnCerrar} onClick={onCerrar}>✕</button>
        </div>

        <div style={S.manualBox}>
          <div style={S.manualTitulo}>Datos manuales — de aquí se calcula todo lo demás</div>
          <div style={S.manualGrid}>
            <label style={S.manualCampo}>
              <span style={S.manualLabel}>Fecha de poda</span>
              <input type="date" style={S.inputFecha} value={lote.poda || ""}
                onChange={e => onActualizar(lote.lote, { poda: e.target.value || null })} />
            </label>
            <label style={S.manualCampo}>
              <span style={S.manualLabel}>Fecha de cianamida</span>
              <input type="date" style={S.inputFecha} value={lote.cianamida || ""}
                onChange={e => onActualizar(lote.lote, { cianamida: e.target.value || null })} />
            </label>
            <label style={S.manualCampo}>
              <span style={S.manualLabel}>Fenología (días)</span>
              <input type="number" style={{ ...S.inputFecha, width: 90 }} value={lote.fenologia || ""}
                onChange={e => {
                  const n = parseInt(e.target.value, 10);
                  if (!isNaN(n)) onActualizar(lote.lote, { fenologia: n });
                }} />
            </label>
          </div>
          {!cia && <div style={S.manualAviso}>Ingresa la fecha de cianamida para que se calculen las fechas.</div>}
        </div>

        <div style={S.laboresLista}>
          <div style={{ ...S.laborFila, background: "transparent", border: "none", padding: "0 10px" }}>
            <span />
            <span style={S.colTitulo}>Labor</span>
            <div style={{ display: "flex", gap: 6 }}>
              <span style={{ ...S.colTitulo, width: 100, textAlign: "center" }}>Fórmula</span>
              <span style={{ ...S.colTitulo, width: 122 }}>Programada</span>
            </div>
          </div>
          {LABORES.map(lab => {
            const esManual = MANUALES.includes(lab);
            const esCosecha = lab === "19. Cosecha";
            const excluida = excluidas.includes(lab);
            if (excluida) return (
              <div key={lab} style={{ ...S.laborFila, background: "#f4f3ec", opacity: 0.75 }}>
                <span />
                <div style={S.laborNombre}>
                  <span style={{ color: "#8a8f85", textDecoration: "line-through" }}>{lab}</span>
                  <span style={S.tagNoAplica}>no aplica en este lote</span>
                </div>
                <button style={S.btnReactivar} onClick={() => toggleExcluida(lab)}
                  title="Volver a incluir esta labor en el lote">
                  Reactivar
                </button>
              </div>
            );
            const prog = fechas[lab];
            const real = reales[`${lote.lote}|${lab}`];
            const est = estadoLabor(prog, real);
            const fo = lote.formulas[lab];
            const diasActual = esCosecha ? lote.fenologia : fo ? fo.dias : "";
            const valor = borradores[lab] !== undefined ? borradores[lab]
              : diasActual === "" ? "" : (diasActual > 0 ? `+${diasActual}` : `${diasActual}`);
            const desv = real && prog ? diffDias(real, prog) : null;
            return (
              <div key={lab} style={{ ...S.laborFila, ...(est === "vencida" ? { background: "#fdf1f0" } : {}), ...(esManual ? S.filaManual : {}) }}>
                <label style={S.laborCheck}>
                  <input type="checkbox" checked={!!real} disabled={!prog}
                    title="Marcar como hecha"
                    onChange={() => onFechaReal(lote.lote, lab, real ? null : hoy())} />
                </label>
                <div style={S.laborNombre}>
                  <span style={real ? { textDecoration: "line-through", color: "#8a8f85" } : {}}>{lab}</span>
                  {esManual && <span style={S.tagAncla}>manual</span>}
                  {est === "vencida" && <span style={S.tagVencida}>vencida</span>}
                  {est === "proxima" && <span style={S.tagProxima}>próxima</span>}
                  {desv !== null && desv !== 0 && (
                    <span style={desv > 0 ? S.tagProxima : S.tagHecha}>{desv > 0 ? `+${desv} d tarde` : `${Math.abs(desv)} d antes`}</span>
                  )}
                </div>
                <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                  {esManual
                    ? <span style={S.formulaFija}>manual</span>
                    : <div style={S.formulaWrap}>
                        <span style={S.formulaBase}>{textoFormula(lab)}</span>
                        <input type="text" inputMode="numeric" style={S.inputFormula}
                          value={valor}
                          disabled={esCosecha ? !cia : !fo}
                          title={esCosecha ? "Fenología (días de cianamida a cosecha)" : `Días respecto a ${textoFormula(lab)}`}
                          onChange={e => setBorradores(b => ({ ...b, [lab]: e.target.value }))}
                          onBlur={e => {
                            if (esCosecha) {
                              const n = parseInt(String(e.target.value).replace(/\s/g, ""), 10);
                              if (!isNaN(n)) onActualizar(lote.lote, { fenologia: n });
                              setBorradores(b => { const c = { ...b }; delete c[lab]; return c; });
                            } else aplicarFormula(lab, e.target.value);
                          }}
                          onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }} />
                      </div>}
                  {esManual
                    ? <input type="date" style={S.inputFechaMini} value={prog || ""}
                        onChange={e => onActualizar(lote.lote,
                          lab === "1.PODA" ? { poda: e.target.value || null } : { cianamida: e.target.value || null })} />
                    : <input type="date" style={S.inputFechaMini} value={prog || ""}
                        onChange={e => cambiarFechaProg(lab, e.target.value)} />}
                  {!esManual
                    ? <button style={S.btnQuitar} onClick={() => toggleExcluida(lab)}
                        title="Esta labor no se hace en este lote — quitarla del cronograma">✕</button>
                    : <span style={{ width: 26 }} />}
                </div>
              </div>
            );
          })}
        </div>

        <div style={S.notaPie}>
          <b>Programada</b> se calcula con la fórmula (bases: <b>CIA</b> cianamida, <b>PODA</b>, <b>RAC</b> a. racimos,
          <b> DES</b> deshuville, <b>COS</b> cosecha, <b>FEN</b> fenología); cambia el número o la fecha y todo se recalcula.
          Marca el <b>check</b> para dar una labor por hecha. Si una labor no se hace en este lote, quítala con la <b>✕</b>
          — aparecerá como "n/a" en el cronograma y no contará en alertas ni avances. Puedes reactivarla cuando quieras.
        </div>
      </div>
    </div>
  );
}
